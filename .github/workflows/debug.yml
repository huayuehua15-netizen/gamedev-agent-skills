name: Debug
on:
  workflow_dispatch:

jobs:
  probe:
    name: Probe ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: python -m pip install --upgrade pip numpy PyYAML
      - name: Facts
        run: python -c "import sys,platform,os;print('py',sys.version.split()[0]);print('cwd',os.getcwd());print('enc',getattr(sys.stdout,'encoding',None))"
      - name: Gate math tests
        run: python tests/test_silhouette_gate.py

  blender-probe:
    name: Blender on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version | head -3
      - name: Install numpy
        run: python3 -m pip install --quiet numpy
      - name: Toolchain check
        env:
          BLENDER: blender
        run: python3 tools/check_toolchain.py