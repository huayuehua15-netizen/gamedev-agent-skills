name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- 纯 Python
  # 不依赖 Blender / Unity，跑得最快，任何环境都能绿。
  #
  # 注意：所有检查都写成 tools/ 下的 Python 文件，不用内联 heredoc。
  # Windows runner 的默认 shell 是 pwsh，不支持 `python - <<'PY'`，
  # 内联 heredoc 会在 Windows 上直接失败。
  python:
    name: Python · tests & build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        # PyYAML 不是标准库，不能假设 runner 预装。
        run: python -m pip install --upgrade pip numpy PyYAML

      - name: Byte-compile every script
        run: python -m compileall -q plugins tools tests

      - name: Gate math unit tests (no Blender required)
        run: python tests/test_silhouette_gate.py

      - name: Manifests, frontmatter and examples
        run: python tools/validate_skills.py

      - name: Scaffolds produce valid output
        run: python tools/check_scaffolds.py

      - name: build.py runs and dist/ matches plugins/
        run: python tools/check_dist.py

  # ---------------------------------------------------------------- 真 Blender
  # 门禁的核心承诺是"退出码可信 + 判定正确"，只有真跑 Blender 才能证明。
  blender:
    name: Blender · gate decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Blender
        # 无 GPU 的 runner 靠 Mesa 软件渲染跑 Workbench。
        # libegl1/libgl1/libgles2 提供 GL API，libgl1-mesa-dri 提供 swrast 实现，
        # libosmesa6 是纯软件路径。缺任何一个，bpy.ops.render.render() 都会
        # 报 "Couldn't open libEGL.so.1" 或渲染出空图。
        run: |
          sudo apt-get update
          sudo apt-get install -y blender libegl1 libgl1 libgles2 \
            libgl1-mesa-dri libosmesa6 libxi6 libxxf86vm1 libxfixes3
          blender --version | head -1

      - name: Install Python deps
        run: python3 -m pip install --quiet numpy

      - name: Every gate decision is correct
        # 覆盖退出码语义与判定质量：匹配的必须过、错的必须拒、
        # 参数拼错必须报错而不是静默跳过门禁。
        env:
          BLENDER: blender
        run: |
          set +e
          python3 tools/check_toolchain.py > toolchain.out 2>&1
          rc=$?
          cat toolchain.out
          if [ $rc -ne 0 ]; then
            # Emit as an annotation so it is readable via the API without
            # admin rights (job logs and artifacts both require auth).
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < <(tail -n 40 toolchain.out)
          fi
          exit $rc

      - name: Upload toolchain report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-report
          path: |
            _finalcheck/**
            toolchain.out
          if-no-files-found: ignore